plugins {
    id 'com.android.library'
}

android {
    compileSdk = libs.versions.compileSdkVersion.get().toInteger()

    defaultConfig {
        minSdkVersion libs.versions.minSdkVersion.get().toInteger()

        vectorDrawables {
            useSupportLibrary true
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        resValues true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        jvmToolchain(21)
    }

    flavorDimensions 'gms'
    productFlavors {
        nongms {
            dimension 'gms'
        }
        fullgms {
            dimension 'gms'
        }
    }

    namespace 'com.thewizrd.weathericons'
    lint {
        targetSdk libs.versions.targetSdkVersion.get().toInteger()
    }
    testOptions {
        targetSdk libs.versions.targetSdkVersion.get().toInteger()
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation project(":shared_resources")

    testImplementation libs.junit
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.annotation
    implementation libs.core.ktx
}